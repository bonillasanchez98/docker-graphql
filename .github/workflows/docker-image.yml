name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Git Semantic Version
      uses: paulhatch/semantic-version@v5.4.0
      with:
        major_pattern: "/major(\\(.+\\))?:/"
        minor_pattern: "/feat(\\(.+\\))?:/"
        version_format: "${major}.${minor}.${patch}-prerelease${increment}"
        bump_each_commit: true
      id: version
    
    - name: Docker Login
      env:
        DOCKER_USER: ${{ secrets.DOCKER_USER }}
        DOCKER_PASSWORD: ${{ secrets.TOKEN_PASS }}
        NEW_VERSION: ${{ steps.Version.outputs.version }}
      run: |
        docker login -u $DOCKER_USER -p $DOCKER_PASSWORD
        
    - name: Build Docker Image
      env:
        NEW_VERSION: ${{ steps.Version.outputs.version }}
      run: |
        docker build -t bonillasanchez98/docker-graphql:$NEW_VERSION .
        docker build -t bonillasanchez98/docker-graphql:latest .

    - name: Push Docker Image
      env:
        NEW_VERSION: ${{ steps.Version.outputs.version }}
      run: |
        docker push bonillasanchez98/docker-graphql:$NEW_VERSION
        docker push bonillasanchez98/docker-graphql:latest
    
    # - name: Build the Docker image
    #   run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)
